name: Legacy Docker image (manual)

on:
  workflow_dispatch:

# The live host uses native Node/systemd. Release staging is release.yml and
# never updates :latest. Keep this legacy publisher explicitly opt-in.
permissions:
  contents: read

jobs:
  build-push:
    if: github.repository == 'dashpay/status' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            dashpay/status:latest
            dashpay/status:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
