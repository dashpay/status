name: Console checks
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  images:
    uses: ./.github/workflows/images.yml
  console:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm test
      - name: Native Platform reset preservation contracts
        run: python3 -m unittest discover -s agent -p 'test_reset_dashnet.py'
      - name: Incident receiver replay, authentication and worker safeguards
        run: python3 -m unittest discover -s deploy/incident-broker -p 'test_*.py'
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Original Testnet API and SSE through the production nginx snippet
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx
          node scripts/smoke-api-compat.mjs
      - name: Native Platform reset UI (desktop and mobile)
        run: node scripts/browser-reset-check.mjs
      - name: Rendered public board and operator deploy flow (fixtures)
        run: node scripts/browser-check.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: console-screenshots
          path: artifacts/
          retention-days: 14
