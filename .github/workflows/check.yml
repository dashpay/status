name: Console checks
on:
  workflow_call:
    inputs:
      release_version:
        type: string
        required: false
  pull_request:
  push:
    branches: [master, feat/network-console]
permissions:
  contents: read
jobs:
  bundles:
    uses: ./.github/workflows/bundle.yml
    with:
      version: ${{ inputs.release_version || format('v0.0.0-ci.{0}', github.run_id) }}
  console:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-check.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: console-browser-fixtures
          path: artifacts/
          retention-days: 14
