# Production stack on the status host. Build and roll out with deploy/deploy.sh.
name: dash-status-v2
x-common: &common
  image: dash-status:current
  pull_policy: never
  init: true
  user: "1000:1000"
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,noexec,nosuid,size=33554432"]
  logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
services:
  web:
    <<: *common
    mem_limit: 512m
    env_file: [/etc/dash-status/oauth.env]
    environment:
      STATUS_MODE: web
      STATUS_DATA_DIR: /data
      PUBLIC_ORIGIN: https://status.testnet.networks.dash.org
    ports: ["127.0.0.1:3006:3001"]
    volumes: ["/srv/dash-status/data:/data"]
  agent:
    <<: *common
    mem_limit: 768m
    stop_grace_period: 30s
    environment:
      STATUS_MODE: agent
      STATUS_DATA_DIR: /data
      AGENT_PRIVATE_DIR: /agent
    volumes: ["/srv/dash-status/data:/data", "/srv/dash-status/agent:/agent"]
